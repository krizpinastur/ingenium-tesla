<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Ingenium Tesla</title>


    <style>

        /* =========================================================
           CONFIGURACIÓN GENERAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;

            background: #181818;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        body {

            display: flex;

            align-items: stretch;

            justify-content: stretch;
        }


        /* =========================================================
           PANEL PRINCIPAL
        ========================================================= */

        .panel {

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            padding: 12px;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        /* =========================================================
           CABECERA COMPACTA
        ========================================================= */

        .cabecera {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            min-height: 24px;
        }


        #estado {

            font-size: 16px;

            font-weight: bold;

            color: #bdbdbd;

            text-align: right;

            white-space: nowrap;
        }


        /* =========================================================
           INFORMACIÓN GPS
        ========================================================= */

        #gps {

            flex-shrink: 0;

            padding: 7px 12px;

            border-radius: 12px;

            background: #303030;

            font-size: 14px;

            color: #d0d0d0;

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================================
           ZONA DE BOTONES
        ========================================================= */

        .botones {

            flex: 1;

            min-width: 0;
            min-height: 0;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            grid-template-rows:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 10px;
        }


        /* =========================================================
           BOTÓN BASE
        ========================================================= */

        .boton {

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            padding: 6px 10px;

            border: none;

            border-radius: 22px;

            color: white;

            font-size: clamp(
                18px,
                2.5vw,
                30px
            );

            font-weight: bold;

            cursor: pointer;

            box-shadow:

                0 8px 14px
                rgba(0, 0, 0, 0.45),

                inset 0 2px 2px
                rgba(255, 255, 255, 0.20);


            transition:

                transform 0.08s ease,

                box-shadow 0.08s ease,

                filter 0.08s ease,

                opacity 0.20s ease;


            user-select: none;

            -webkit-user-select: none;

            touch-action: manipulation;
        }


        /* =========================================================
           EFECTO AL PULSAR
        ========================================================= */

        .boton:active:not(:disabled) {

            transform:
                translateY(5px);


            box-shadow:

                0 3px 7px
                rgba(0, 0, 0, 0.45),

                inset 0 2px 2px
                rgba(255, 255, 255, 0.15);


            filter:
                brightness(0.90);
        }


        /* =========================================================
           BOTÓN BLOQUEADO
        ========================================================= */

        .boton:disabled {

            opacity: 0.25;

            cursor: not-allowed;

            filter:
                grayscale(70%);
        }


        /* =========================================================
           COLORES
        ========================================================= */

        .alarma {

            background:
                linear-gradient(
                    to bottom,
                    #42a5f5,
                    #0d47a1
                );
        }


        .finca {

            background:
                linear-gradient(
                    to bottom,
                    #66bb6a,
                    #1b5e20
                );
        }


        .garaje {

            background:
                linear-gradient(
                    to bottom,
                    #ffb74d,
                    #e65100
                );
        }


        .portones {

            background:
                linear-gradient(
                    to bottom,
                    #ef5350,
                    #8e0000
                );
        }


        /* =========================================================
           PANTALLA DE EMPAREJAMIENTO
        ========================================================= */

        #emparejamiento {

            position: fixed;

            inset: 0;

            background: #181818;

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 1000;

            padding: 20px;
        }


        .pairCard {

            width: 90%;

            max-width: 600px;

            background: #303030;

            padding: 30px;

            border-radius: 28px;

            text-align: center;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.50);
        }


        .pairCard h2 {

            margin-top: 0;

            font-size: 30px;
        }


        .pairCard p {

            font-size: 18px;

            color: #d0d0d0;
        }


        .pairCard input {

            width: 100%;

            height: 65px;

            margin-top: 15px;

            text-align: center;

            font-size: 28px;

            border-radius: 18px;

            border: none;

            outline: none;
        }


        .pairCard button {

            width: 100%;

            height: 70px;

            margin-top: 18px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    to bottom,
                    #42a5f5,
                    #0d47a1
                );

            color: white;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;
        }


        #pairEstado {

            margin-top: 18px;

            color: #bdbdbd;

            font-size: 18px;
        }


        audio {

            display: none;
        }


        /* =========================================================
           VENTANA MUY BAJA / REDUCIDA DEL TESLA
        ========================================================= */

        @media (max-height: 500px) {

            .panel {

                padding: 8px;

                gap: 6px;
            }


            .cabecera {

                min-height: 18px;
            }


            #estado {

                font-size: 13px;
            }


            #gps {

                padding: 4px 8px;

                font-size: 12px;

                border-radius: 9px;
            }


            .botones {

                gap: 7px;
            }


            .boton {

                border-radius: 16px;

                font-size:
                    clamp(
                        15px,
                        2vw,
                        23px
                    );

                box-shadow:

                    0 5px 9px
                    rgba(0, 0, 0, 0.40),

                    inset 0 1px 2px
                    rgba(255, 255, 255, 0.18);
            }
        }


        /* =========================================================
           PANTALLA GRANDE
        ========================================================= */

        @media (min-width: 1100px) and (min-height: 600px) {

            .panel {

                padding: 20px;

                gap: 14px;
            }


            #estado {

                font-size: 20px;
            }


            #gps {

                padding: 10px 16px;

                font-size: 17px;
            }


            .botones {

                gap: 18px;
            }


            .boton {

                border-radius: 28px;

                font-size:
                    clamp(
                        24px,
                        2.4vw,
                        36px
                    );

                box-shadow:

                    0 14px 24px
                    rgba(0, 0, 0, 0.45),

                    inset 0 3px 2px
                    rgba(255, 255, 255, 0.22);
            }
        }

    </style>

</head>


<body>


<!-- =============================================================
     PANEL PRINCIPAL
============================================================= -->

<div class="panel">


    <!-- ESTADO -->

    <div class="cabecera">

        <div id="estado">
            Iniciando...
        </div>

    </div>


    <!-- GPS -->

    <div id="gps">
        Esperando GPS...
    </div>


    <!-- BOTONES -->

    <div class="botones">


        <button
            class="boton alarma"
            disabled
            onclick="
                enviarOrden(
                    '/alarma',
                    'Alarma'
                )
            "
        >

            CONECTAR ALARMA

        </button>


        <button
            class="boton finca"
            disabled
            onclick="
                enviarOrden(
                    '/porton-finca',
                    'Portón finca'
                )
            "
        >

            PORTÓN FINCA

        </button>


        <button
            class="boton garaje"
            disabled
            onclick="
                enviarOrden(
                    '/porton-garaje',
                    'Portón garaje'
                )
            "
        >

            PORTÓN GARAJE

        </button>


        <button
            class="boton portones"
            disabled
            onclick="
                enviarOrden(
                    '/portones',
                    'Portones'
                )
            "
        >

            PORTONES

        </button>


    </div>

</div>



<!-- =============================================================
     EMPAREJAMIENTO DEL TESLA
============================================================= -->

<div id="emparejamiento">


    <div class="pairCard">


        <h2>
            Emparejar Tesla
        </h2>


        <p>
            Introduce el código temporal
            de emparejamiento.
        </p>


        <input
            id="codigoPair"
            type="password"
            inputmode="numeric"
            placeholder="Código"
        >


        <button
            onclick="emparejar()"
        >

            Emparejar vehículo

        </button>


        <div id="pairEstado">

        </div>


    </div>

</div>



<!-- =============================================================
     SONIDO
============================================================= -->

<audio
    id="sonidoBoton"
    src="button_click.mp3"
    preload="auto">
</audio>



<script>


    // =============================================================
    // WORKER DE CLOUDFLARE
    // =============================================================

    const worker =

        "https://ingenium-control.pablo-dosuarez.workers.dev";



    // =============================================================
    // ZONA AUTORIZADA
    // =============================================================

    const HOME_LAT =
        43.5581498;


    const HOME_LON =
        -5.9476139;


    // Radio permitido alrededor de casa

    const RADIO =
        300;


    // Precisión GPS máxima permitida

    const PRECISION_MAX =
        100;



    // =============================================================
    // VARIABLES DE ESTADO
    // =============================================================

    let posicionActual =
        null;


    let zonaValida =
        false;


    let gpsIniciado =
        false;



    // =============================================================
    // CUANDO CARGA LA WEB
    // =============================================================

    window.addEventListener(

        "load",

        function() {


            const token =

                localStorage.getItem(
                    "ingeniumTeslaToken"
                );


            // Si el Tesla todavía no está emparejado

            if (!token) {


                mostrarEmparejamiento();


            } else {


                iniciarGPS();

            }

        }

    );



    // =============================================================
    // MOSTRAR EMPAREJAMIENTO
    // =============================================================

    function mostrarEmparejamiento() {


        document
            .getElementById(
                "emparejamiento"
            )
            .style.display =
                "flex";

    }



    // =============================================================
    // EMPAREJAR TESLA
    // =============================================================

    async function emparejar() {


        const codigo =

            document
                .getElementById(
                    "codigoPair"
                )
                .value
                .trim();


        const estado =

            document
                .getElementById(
                    "pairEstado"
                );


        if (!codigo) {


            estado.innerText =

                "Introduce el código";


            return;

        }


        estado.innerText =

            "Emparejando...";


        try {


            const respuesta =

                await fetch(

                    worker +
                    "/pair",

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body:

                            JSON.stringify(

                                {

                                    code:
                                        codigo

                                }

                            )

                    }

                );


            const datos =

                await respuesta.json();


            if (!respuesta.ok) {


                estado.innerText =

                    datos.error ||

                    "Error de emparejamiento";


                return;

            }


            // Guardamos el token
            // exclusivamente en el navegador Tesla

            localStorage.setItem(

                "ingeniumTeslaToken",

                datos.token

            );


            estado.innerText =

                "Tesla emparejado correctamente";


            setTimeout(

                function() {


                    document
                        .getElementById(
                            "emparejamiento"
                        )
                        .style.display =
                            "none";


                    iniciarGPS();


                },

                800

            );


        } catch (error) {


            estado.innerText =

                "Error de conexión";


            console.error(
                error
            );

        }

    }



    // =============================================================
    // INICIAR GPS
    // =============================================================

    function iniciarGPS() {


        if (gpsIniciado) {

            return;

        }


        gpsIniciado =
            true;


        const estado =

            document
                .getElementById(
                    "estado"
                );


        if (!navigator.geolocation) {


            estado.innerText =

                "GPS no disponible";


            return;

        }


        estado.innerText =

            "Buscando GPS...";


        navigator.geolocation.watchPosition(


            actualizarPosicion,


            errorGPS,


            {

                enableHighAccuracy:
                    true,


                maximumAge:
                    0,


                timeout:
                    20000

            }

        );

    }



    // =============================================================
    // NUEVA POSICIÓN GPS
    // =============================================================

    function actualizarPosicion(
        posicion
    ) {


        const lat =

            posicion.coords.latitude;


        const lon =

            posicion.coords.longitude;


        const accuracy =

            posicion.coords.accuracy;


        const distancia =

            calcularDistancia(

                lat,
                lon,

                HOME_LAT,
                HOME_LON

            );


        posicionActual = {

            lat:
                lat,

            lon:
                lon,

            accuracy:
                accuracy

        };


        // ---------------------------------------------------------
        // MOSTRAR INFORMACIÓN
        // ---------------------------------------------------------

        document
            .getElementById(
                "gps"
            )
            .innerText =

                "Distancia " +
                Math.round(distancia) +
                " m   •   GPS ±" +
                Math.round(accuracy) +
                " m";


        // ---------------------------------------------------------
        // COMPROBAR CONDICIONES
        // ---------------------------------------------------------

        zonaValida =

            distancia <= RADIO

            &&

            accuracy <= PRECISION_MAX;


        actualizarBotones();


        if (zonaValida) {


            document
                .getElementById(
                    "estado"
                )
                .innerText =

                    "● AUTORIZADO";


        } else {


            if (accuracy > PRECISION_MAX) {


                document
                    .getElementById(
                        "estado"
                    )
                    .innerText =

                        "GPS sin precisión";


            } else {


                document
                    .getElementById(
                        "estado"
                    )
                    .innerText =

                        "🔒 FUERA DE ZONA";

            }

        }

    }



    // =============================================================
    // ERROR GPS
    // =============================================================

    function errorGPS(
        error
    ) {


        zonaValida =
            false;


        actualizarBotones();


        document
            .getElementById(
                "estado"
            )
            .innerText =

                "GPS no disponible";


        console.log(
            error
        );

    }



    // =============================================================
    // ACTIVAR / BLOQUEAR BOTONES
    // =============================================================

    function actualizarBotones() {


        const botones =

            document
                .querySelectorAll(
                    ".boton"
                );


        botones.forEach(

            function(boton) {


                boton.disabled =

                    !zonaValida;

            }

        );

    }



    // =============================================================
    // EJECUTAR ESCENA
    // =============================================================

    async function enviarOrden(
        accion,
        nombre
    ) {


        // Sin GPS válido no hacemos nada

        if (
            !zonaValida ||
            !posicionActual
        ) {


            return;

        }


        // Sonido inmediato

        reproducirSonido();


        const token =

            localStorage.getItem(
                "ingeniumTeslaToken"
            );


        // Sin token tampoco ejecutamos

        if (!token) {


            mostrarEmparejamiento();


            return;

        }


        const estado =

            document
                .getElementById(
                    "estado"
                );


        estado.innerText =

            "Enviando...";


        try {


            const respuesta =

                await fetch(

                    worker +
                    accion,

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json",


                            "Authorization":

                                "Bearer " +
                                token

                        },


                        body:

                            JSON.stringify(

                                {

                                    lat:
                                        posicionActual.lat,


                                    lon:
                                        posicionActual.lon,


                                    accuracy:
                                        posicionActual.accuracy

                                }

                            )

                    }

                );


            const datos =

                await respuesta.json();


            if (respuesta.ok) {


                estado.innerText =

                    nombre +
                    " enviado";


            } else {


                // Token no válido / revocado

                if (
                    respuesta.status === 401
                ) {


                    localStorage.removeItem(
                        "ingeniumTeslaToken"
                    );


                    estado.innerText =

                        "Tesla no autorizado";


                    setTimeout(

                        mostrarEmparejamiento,

                        700

                    );


                    return;

                }


                estado.innerText =

                    datos.error ||

                    "Acceso bloqueado";

            }


        } catch (error) {


            estado.innerText =

                "Error de conexión";


            console.error(
                error
            );

        }


        // ---------------------------------------------------------
        // RECUPERAR ESTADO
        // ---------------------------------------------------------

        setTimeout(

            function() {


                if (zonaValida) {


                    estado.innerText =

                        "● AUTORIZADO";


                } else {


                    estado.innerText =

                        "🔒 FUERA DE ZONA";

                }

            },

            2500

        );

    }



    // =============================================================
    // SONIDO
    // =============================================================

    function reproducirSonido() {


        const audio =

            document
                .getElementById(
                    "sonidoBoton"
                );


        try {


            audio.pause();


            audio.currentTime =
                0;


            const reproduccion =

                audio.play();


            if (
                reproduccion !== undefined
            ) {


                reproduccion.catch(

                    function(error) {


                        console.log(
                            "Audio bloqueado:",
                            error
                        );

                    }

                );

            }


        } catch (error) {


            console.log(
                error
            );

        }

    }



    // =============================================================
    // CALCULAR DISTANCIA
    // Fórmula de Haversine
    // =============================================================

    function calcularDistancia(

        lat1,
        lon1,

        lat2,
        lon2

    ) {


        const R =
            6371000;


        const rad =

            grados =>

                grados *
                Math.PI /
                180;


        const dLat =

            rad(
                lat2 -
                lat1
            );


        const dLon =

            rad(
                lon2 -
                lon1
            );


        const a =

            Math.sin(
                dLat / 2
            ) ** 2

            +

            Math.cos(
                rad(lat1)
            )

            *

            Math.cos(
                rad(lat2)
            )

            *

            Math.sin(
                dLon / 2
            ) ** 2;


        const c =

            2 *

            Math.atan2(

                Math.sqrt(a),

                Math.sqrt(
                    1 - a
                )

            );


        return R * c;

    }


</script>


</body>

</html>
