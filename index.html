<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >
    <title>Prueba GPS Tesla</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #181818;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .panel {
            width: 100%;
            max-width: 900px;
            background: #2b2b2b;
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .dato {
            margin-top: 22px;
            padding: 18px;
            background: #383838;
            border-radius: 18px;
            font-size: 24px;
        }

        #estado {
            margin-top: 25px;
            font-size: 22px;
            color: #bdbdbd;
        }

        button {
            width: 100%;
            height: 90px;
            margin-top: 30px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(to bottom, #42a5f5, #0d47a1);
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(5px);
        }
    </style>
</head>

<body>

<div class="panel">

    <h1>Prueba GPS Tesla</h1>

    <div class="dato">
        Latitud:
        <span id="latitud">---</span>
    </div>

    <div class="dato">
        Longitud:
        <span id="longitud">---</span>
    </div>

    <div class="dato">
        Precisión:
        <span id="precision">---</span> metros
    </div>

    <div id="estado">
        Esperando ubicación...
    </div>

    <button onclick="obtenerUbicacion()">
        Obtener ubicación
    </button>

</div>

<script>
    function obtenerUbicacion() {

        const estado = document.getElementById("estado");

        if (!navigator.geolocation) {
            estado.innerText = "Este navegador no soporta geolocalización.";
            return;
        }

        estado.innerText = "Solicitando ubicación...";

        navigator.geolocation.getCurrentPosition(

            function(posicion) {
                const lat = posicion.coords.latitude;
                const lon = posicion.coords.longitude;
                const precision = posicion.coords.accuracy;

                document.getElementById("latitud").innerText = lat.toFixed(7);
                document.getElementById("longitud").innerText = lon.toFixed(7);
                document.getElementById("precision").innerText = Math.round(precision);

                estado.innerText = "Ubicación obtenida correctamente.";
            },

            function(error) {
                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        estado.innerText = "Permiso de ubicación denegado.";
                        break;

                    case error.POSITION_UNAVAILABLE:
                        estado.innerText = "Ubicación no disponible.";
                        break;

                    case error.TIMEOUT:
                        estado.innerText = "Tiempo agotado obteniendo ubicación.";
                        break;

                    default:
                        estado.innerText = "Error desconocido obteniendo ubicación.";
                }
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }
</script>

</body>
</html>
