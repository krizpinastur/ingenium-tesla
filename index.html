<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Ingenium Tesla</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            background: #181818;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;
        }


        .panel {

            width: 100%;
            height: 100%;

            padding: 28px;

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .cabecera {

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .titulo {

            font-size: 34px;

            font-weight: bold;
        }


        #estado {

            font-size: 20px;

            color: #bdbdbd;

            text-align: right;
        }


        #gps {

            padding: 14px 20px;

            border-radius: 16px;

            background: #303030;

            font-size: 18px;

            color: #d0d0d0;
        }


        .botones {

            flex: 1;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 22px;
        }


        .boton {

            border: none;

            border-radius: 30px;

            color: white;

            font-size: 32px;

            font-weight: bold;

            cursor: pointer;


            box-shadow:

                0 14px 24px
                rgba(0, 0, 0, 0.45),

                inset 0 3px 2px
                rgba(255, 255, 255, 0.22);


            transition:
                transform 0.08s ease,
                box-shadow 0.08s ease,
                filter 0.08s ease,
                opacity 0.2s;
        }


        .boton:active:not(:disabled) {

            transform:
                translateY(7px);

            box-shadow:

                0 5px 10px
                rgba(0, 0, 0, 0.4),

                inset 0 2px 2px
                rgba(255, 255, 255, 0.15);
        }


        .boton:disabled {

            opacity: 0.25;

            cursor: not-allowed;

            filter: grayscale(70%);
        }


        .alarma {

            background:
                linear-gradient(
                    to bottom,
                    #42a5f5,
                    #0d47a1
                );
        }


        .finca {

            background:
                linear-gradient(
                    to bottom,
                    #66bb6a,
                    #1b5e20
                );
        }


        .garaje {

            background:
                linear-gradient(
                    to bottom,
                    #ffb74d,
                    #e65100
                );
        }


        .portones {

            background:
                linear-gradient(
                    to bottom,
                    #ef5350,
                    #8e0000
                );
        }


        #emparejamiento {

            position: fixed;

            inset: 0;

            background: #181818;

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 1000;
        }


        .pairCard {

            width: 90%;

            max-width: 650px;

            background: #303030;

            padding: 35px;

            border-radius: 28px;

            text-align: center;
        }


        .pairCard h2 {

            font-size: 32px;
        }


        .pairCard input {

            width: 100%;

            height: 75px;

            margin-top: 20px;

            text-align: center;

            font-size: 30px;

            border-radius: 18px;

            border: none;
        }


        .pairCard button {

            width: 100%;

            height: 80px;

            margin-top: 20px;

            border: none;

            border-radius: 20px;

            background: #1565c0;

            color: white;

            font-size: 26px;

            font-weight: bold;
        }


        #pairEstado {

            margin-top: 20px;

            color: #bdbdbd;

            font-size: 20px;
        }


        audio {

            display: none;
        }


    </style>

</head>


<body>


<div class="panel">


    <div class="cabecera">


        <div class="titulo">

            Ingenium Control

        </div>


        <div id="estado">

            Iniciando...

        </div>


    </div>


    <div id="gps">

        Esperando GPS...

    </div>


    <div class="botones">


        <button
            class="boton alarma"
            disabled
            onclick="
                enviarOrden(
                    '/alarma',
                    'Alarma'
                )
            "
        >

            Conectar
            <br>
            Alarma

        </button>


        <button
            class="boton finca"
            disabled
            onclick="
                enviarOrden(
                    '/porton-finca',
                    'Portón finca'
                )
            "
        >

            Portón
            <br>
            finca

        </button>


        <button
            class="boton garaje"
            disabled
            onclick="
                enviarOrden(
                    '/porton-garaje',
                    'Portón garaje'
                )
            "
        >

            Portón
            <br>
            garaje

        </button>


        <button
            class="boton portones"
            disabled
            onclick="
                enviarOrden(
                    '/portones',
                    'Portones'
                )
            "
        >

            Portones

        </button>


    </div>


</div>


<!-- =========================================================
     EMPAREJAMIENTO
========================================================= -->


<div id="emparejamiento">


    <div class="pairCard">


        <h2>
            Emparejar Tesla
        </h2>


        <p>
            Introduce el código temporal
            de emparejamiento.
        </p>


        <input
            id="codigoPair"
            type="password"
            inputmode="numeric"
            placeholder="Código"
        >


        <button
            onclick="emparejar()"
        >

            Emparejar vehículo

        </button>


        <div id="pairEstado">

        </div>


    </div>


</div>


<audio
    id="sonidoBoton"
    src="button_click.mp3"
    preload="auto">
</audio>


<script>


    // =============================================================
    // WORKER
    // =============================================================


    const worker =

        "https://ingenium-control.pablo-dosuarez.workers.dev";



    // =============================================================
    // CONFIGURACIÓN LOCAL
    // =============================================================


    const HOME_LAT =
        43.5581498;


    const HOME_LON =
        -5.9476139;


    const RADIO =
        300;


    const PRECISION_MAX =
        100;



    // =============================================================
    // VARIABLES
    // =============================================================


    let posicionActual =
        null;


    let zonaValida =
        false;



    // =============================================================
    // INICIO
    // =============================================================


    window.addEventListener(
        "load",

        function() {


            const token =
                localStorage.getItem(
                    "ingeniumTeslaToken"
                );


            if (!token) {


                mostrarEmparejamiento();


            } else {


                iniciarGPS();

            }

        }
    );



    // =============================================================
    // EMPAREJAMIENTO
    // =============================================================


    function mostrarEmparejamiento() {


        document
            .getElementById(
                "emparejamiento"
            )
            .style.display =
                "flex";

    }



    async function emparejar() {


        const codigo =

            document
                .getElementById(
                    "codigoPair"
                )
                .value;


        const estado =

            document
                .getElementById(
                    "pairEstado"
                );


        estado.innerText =
            "Emparejando...";


        try {


            const respuesta =

                await fetch(

                    worker + "/pair",

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body:
                            JSON.stringify(
                                {
                                    code:
                                        codigo
                                }
                            )

                    }

                );


            const datos =
                await respuesta.json();


            if (!respuesta.ok) {


                estado.innerText =

                    datos.error ||
                    "Error de emparejamiento";


                return;

            }


            localStorage.setItem(

                "ingeniumTeslaToken",

                datos.token

            );


            estado.innerText =

                "Tesla emparejado correctamente";


            setTimeout(

                function() {


                    document
                        .getElementById(
                            "emparejamiento"
                        )
                        .style.display =
                            "none";


                    iniciarGPS();


                },

                1000

            );


        } catch (error) {


            estado.innerText =

                "Error de conexión";

        }

    }



    // =============================================================
    // GPS
    // =============================================================


    function iniciarGPS() {


        const estado =

            document
                .getElementById(
                    "estado"
                );


        if (!navigator.geolocation) {


            estado.innerText =

                "GPS no disponible";


            return;

        }


        estado.innerText =

            "Buscando GPS...";


        navigator.geolocation.watchPosition(


            actualizarPosicion,


            errorGPS,


            {

                enableHighAccuracy:
                    true,


                maximumAge:
                    0,


                timeout:
                    20000

            }

        );

    }



    function actualizarPosicion(
        posicion
    ) {


        const lat =

            posicion.coords.latitude;


        const lon =

            posicion.coords.longitude;


        const accuracy =

            posicion.coords.accuracy;


        const distancia =

            calcularDistancia(

                lat,
                lon,

                HOME_LAT,
                HOME_LON

            );


        posicionActual = {

            lat:
                lat,

            lon:
                lon,

            accuracy:
                accuracy

        };


        document
            .getElementById(
                "gps"
            )
            .innerText =

                "Distancia: " +
                Math.round(distancia) +
                " m   |   " +

                "Precisión: " +
                Math.round(accuracy) +
                " m";


        zonaValida =

            distancia <= RADIO

            &&

            accuracy <= PRECISION_MAX;


        actualizarBotones();


        if (zonaValida) {


            document
                .getElementById(
                    "estado"
                )
                .innerText =

                    "● Acceso autorizado";


        } else {


            document
                .getElementById(
                    "estado"
                )
                .innerText =

                    "🔒 Fuera de zona";

        }

    }



    function errorGPS(error) {


        zonaValida =
            false;


        actualizarBotones();


        document
            .getElementById(
                "estado"
            )
            .innerText =

                "GPS no disponible";

    }



    // =============================================================
    // BOTONES
    // =============================================================


    function actualizarBotones() {


        const botones =

            document
                .querySelectorAll(
                    ".boton"
                );


        botones.forEach(

            boton => {


                boton.disabled =

                    !zonaValida;

            }

        );

    }



    // =============================================================
    // ENVIAR ORDEN
    // =============================================================


    async function enviarOrden(
        accion,
        nombre
    ) {


        if (
            !zonaValida ||
            !posicionActual
        ) {


            return;

        }


        reproducirSonido();


        const token =

            localStorage.getItem(
                "ingeniumTeslaToken"
            );


        const estado =

            document
                .getElementById(
                    "estado"
                );


        estado.innerText =

            "Enviando " +
            nombre +
            "...";


        try {


            const respuesta =

                await fetch(

                    worker + accion,

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json",


                            "Authorization":
                                "Bearer " +
                                token

                        },


                        body:
                            JSON.stringify(

                                {

                                    lat:
                                        posicionActual.lat,

                                    lon:
                                        posicionActual.lon,

                                    accuracy:
                                        posicionActual.accuracy

                                }

                            )

                    }

                );


            const datos =

                await respuesta.json();


            if (respuesta.ok) {


                estado.innerText =

                    nombre +
                    " enviado";


            } else {


                estado.innerText =

                    datos.error ||
                    "Acceso bloqueado";

            }


        } catch (error) {


            estado.innerText =

                "Error de conexión";

        }


        setTimeout(

            function() {


                if (zonaValida) {


                    estado.innerText =

                        "● Acceso autorizado";


                } else {


                    estado.innerText =

                        "🔒 Fuera de zona";

                }

            },

            2500

        );

    }



    // =============================================================
    // SONIDO
    // =============================================================


    function reproducirSonido() {


        const audio =

            document
                .getElementById(
                    "sonidoBoton"
                );


        audio.pause();


        audio.currentTime =
            0;


        audio.play()
            .catch(

                function(error) {

                    console.log(
                        error
                    );

                }

            );

    }



    // =============================================================
    // DISTANCIA
    // =============================================================


    function calcularDistancia(

        lat1,
        lon1,
        lat2,
        lon2

    ) {


        const R =
            6371000;


        const rad =

            grados =>

                grados *
                Math.PI /
                180;


        const dLat =

            rad(
                lat2 -
                lat1
            );


        const dLon =

            rad(
                lon2 -
                lon1
            );


        const a =

            Math.sin(
                dLat / 2
            ) ** 2

            +

            Math.cos(
                rad(lat1)
            )

            *

            Math.cos(
                rad(lat2)
            )

            *

            Math.sin(
                dLon / 2
            ) ** 2;


        const c =

            2 *

            Math.atan2(

                Math.sqrt(a),

                Math.sqrt(
                    1 - a
                )

            );


        return R * c;

    }


</script>


</body>

</html>
