<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Ingenium Tesla</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #181818;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .panel {
            width: 100%;
            height: 100%;
            padding: 28px;

            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .titulo {
            font-size: 34px;
            font-weight: bold;
        }

        #estado {
            font-size: 20px;
            color: #bdbdbd;
        }

        .botones {
            flex: 1;

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;

            gap: 22px;
        }

        .boton {
            border: none;
            border-radius: 30px;

            color: white;

            font-size: 32px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 14px 24px rgba(0, 0, 0, 0.45),
                inset 0 3px 2px rgba(255, 255, 255, 0.22);

            transition:
                transform 0.08s ease,
                box-shadow 0.08s ease,
                filter 0.08s ease;

            user-select: none;
            -webkit-user-select: none;
        }

        .boton:active {

            transform: translateY(7px);

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.4),
                inset 0 2px 2px rgba(255, 255, 255, 0.15);

            filter: brightness(0.9);
        }

        .alarma {
            background:
                linear-gradient(
                    to bottom,
                    #42a5f5,
                    #0d47a1
                );
        }

        .finca {
            background:
                linear-gradient(
                    to bottom,
                    #66bb6a,
                    #1b5e20
                );
        }

        .portones {
            background:
                linear-gradient(
                    to bottom,
                    #ef5350,
                    #8e0000
                );
        }

        .garaje {
            background:
                linear-gradient(
                    to bottom,
                    #ffb74d,
                    #e65100
                );
        }

        @media (max-width: 900px) {

            body {
                overflow: auto;
            }

            .botones {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .boton {
                min-height: 130px;
            }
        }

    </style>

</head>


<body>

<div class="panel">

    <div class="cabecera">

        <div class="titulo">
            Ingenium Control
        </div>

        <div id="estado">
            Listo
        </div>

    </div>


    <div class="botones">


        <button
            class="boton alarma"
            onclick="enviarOrden('/alarma', 'Alarma')"
        >
            CONECTAR
            <br>
            ALARMA
        </button>


        <button
            class="boton finca"
            onclick="enviarOrden('/porton-finca', 'Portón finca')"
        >
            PORTON
            <br>
            FINCA
        </button>


        <button
            class="boton portones"
            onclick="enviarOrden('/portones', 'Portones')"
        >
            PORTONES
        </button>


        <button
            class="boton garaje"
            onclick="enviarOrden('/porton-garaje', 'Portón garaje')"
        >
            PORTON
            <br>
            GARAJE
        </button>


    </div>

</div>


<script>

    const worker =
        "https://ingenium-control.pablo-dosuarez.workers.dev";


    async function enviarOrden(
        accion,
        nombre
    ) {

        const estado =
            document.getElementById("estado");


        estado.innerText =
            "Enviando " + nombre + "...";


        try {

            const respuesta =
                await fetch(
                    worker + accion,
                    {
                        method: "POST"
                    }
                );


            if (respuesta.ok) {

                estado.innerText =
                    nombre + " enviado";

            } else {

                estado.innerText =
                    "Error " + respuesta.status;
            }


        } catch (error) {

            estado.innerText =
                "Error de conexión";

            console.error(error);
        }


        setTimeout(
            function () {

                estado.innerText =
                    "Listo";

            },

            2500
        );
    }

</script>


</body>

</html>
