<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Ingenium Tesla</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;

            background: #181818;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        body {

            display: flex;

            align-items: stretch;

            justify-content: stretch;
        }


        /* =====================================================
           PANEL
        ===================================================== */

        .panel {

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            padding: 12px;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        /* =====================================================
           ESTADO
        ===================================================== */

        .cabecera {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            min-height: 24px;
        }


        #estado {

            font-size: 16px;

            font-weight: bold;

            color: #bdbdbd;

            text-align: right;

            white-space: nowrap;
        }


        /* =====================================================
           GPS
        ===================================================== */

        #gps {

            flex-shrink: 0;

            padding: 7px 12px;

            border-radius: 12px;

            background: #303030;

            font-size: 14px;

            color: #d0d0d0;

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =====================================================
           CUADRÍCULA
        ===================================================== */

        .botones {

            flex: 1;

            min-width: 0;
            min-height: 0;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            grid-template-rows:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 10px;
        }


        /* =====================================================
           BOTONES
        ===================================================== */

        .boton {

            width: 100%;
            height: 100%;

            min-width: 0;
            min-height: 0;

            padding: 6px 10px;

            border: none;

            border-radius: 22px;

            color: white;

            font-size:
                clamp(
                    18px,
                    2.5vw,
                    30px
                );

            font-weight: bold;

            cursor: pointer;

            box-shadow:

                0 8px 14px
                rgba(0, 0, 0, 0.45),

                inset 0 2px 2px
                rgba(255, 255, 255, 0.20);


            transition:

                transform 0.08s ease,

                box-shadow 0.08s ease,

                filter 0.08s ease,

                opacity 0.20s ease;


            user-select: none;

            -webkit-user-select: none;

            touch-action: manipulation;
        }


        .boton:active:not(:disabled) {

            transform:
                translateY(5px);


            box-shadow:

                0 3px 7px
                rgba(0, 0, 0, 0.45),

                inset 0 2px 2px
                rgba(255, 255, 255, 0.15);


            filter:
                brightness(0.90);
        }


        .boton:disabled {

            opacity: 0.25;

            cursor: not-allowed;

            filter:
                grayscale(70%);
        }


        /* =====================================================
           COLORES
        ===================================================== */

        .alarma {

            background:
                linear-gradient(
                    to bottom,
                    #42a5f5,
                    #0d47a1
                );
        }


        .garaje {

            background:
                linear-gradient(
                    to bottom,
                    #ffb74d,
                    #e65100
                );
        }


        .portones {

            background:
                linear-gradient(
                    to bottom,
                    #ef5350,
                    #8e0000
                );
        }


        .finca {

            background:
                linear-gradient(
                    to bottom,
                    #66bb6a,
                    #1b5e20
                );
        }


        /* =====================================================
           EMPAREJAMIENTO
        ===================================================== */

        #emparejamiento {

            position: fixed;

            inset: 0;

            background: #181818;

            display: none;

            align-items: center;

            justify-content: center;

            z-index: 1000;

            padding: 20px;
        }


        .pairCard {

            width: 90%;

            max-width: 600px;

            background: #303030;

            padding: 30px;

            border-radius: 28px;

            text-align: center;

            box-shadow:

                0 15px 35px
                rgba(0, 0, 0, 0.50);
        }


        .pairCard h2 {

            margin-top: 0;

            font-size: 30px;
        }


        .pairCard p {

            font-size: 18px;

            color: #d0d0d0;
        }


        .pairCard input {

            width: 100%;

            height: 65px;

            margin-top: 15px;

            text-align: center;

            font-size: 28px;

            border-radius: 18px;

            border: none;

            outline: none;
        }


        .pairCard button {

            width: 100%;

            height: 70px;

            margin-top: 18px;

            border: none;

            border-radius: 20px;

            background:

                linear-gradient(
                    to bottom,
                    #42a5f5,
                    #0d47a1
                );

            color: white;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;
        }


        #pairEstado {

            margin-top: 18px;

            color: #bdbdbd;

            font-size: 18px;
        }


        audio {

            display: none;
        }


        /* =====================================================
           VENTANA REDUCIDA TESLA
        ===================================================== */

        @media (max-height: 500px) {


            .panel {

                padding: 8px;

                gap: 6px;
            }


            .cabecera {

                min-height: 18px;
            }


            #estado {

                font-size: 13px;
            }


            #gps {

                padding: 4px 8px;

                font-size: 12px;

                border-radius: 9px;
            }


            .botones {

                gap: 7px;
            }


            .boton {

                border-radius: 16px;

                font-size:

                    clamp(
                        15px,
                        2vw,
                        23px
                    );
            }
        }


        /* =====================================================
           PANTALLA GRANDE
        ===================================================== */

        @media (
            min-width: 1100px
        ) and (
            min-height: 600px
        ) {


            .panel {

                padding: 20px;

                gap: 14px;
            }


            #estado {

                font-size: 20px;
            }


            #gps {

                padding: 10px 16px;

                font-size: 17px;
            }


            .botones {

                gap: 18px;
            }


            .boton {

                border-radius: 28px;

                font-size:

                    clamp(
                        24px,
                        2.4vw,
                        36px
                    );
            }
        }

    </style>

</head>


<body>


<!-- =============================================================
     INTERFAZ PRINCIPAL
============================================================= -->

<div class="panel">


    <div class="cabecera">

        <div id="estado">
            Iniciando...
        </div>

    </div>


    <div id="gps">

        Esperando GPS...

    </div>


    <!-- =========================================================
         ORDEN DEFINITIVO:

         ARRIBA IZQUIERDA  → ALARMA
         ARRIBA DERECHA    → GARAJE

         ABAJO IZQUIERDA   → PORTONES
         ABAJO DERECHA     → FINCA
    ========================================================== -->

    <div class="botones">


        <!-- ARRIBA IZQUIERDA -->

        <button
            class="boton alarma"
            disabled
            onclick="
                enviarOrden(
                    '/alarma',
                    'Alarma'
                )
            "
        >

            CONECTAR ALARMA

        </button>


        <!-- ARRIBA DERECHA -->

        <button
            class="boton garaje"
            disabled
            onclick="
                enviarOrden(
                    '/porton-garaje',
                    'Portón garaje'
                )
            "
        >

            PORTÓN GARAJE

        </button>


        <!-- ABAJO IZQUIERDA -->

        <button
            class="boton portones"
            disabled
            onclick="
                enviarOrden(
                    '/portones',
                    'Portones'
                )
            "
        >

            PORTONES

        </button>


        <!-- ABAJO DERECHA -->

        <button
            class="boton finca"
            disabled
            onclick="
                enviarOrden(
                    '/porton-finca',
                    'Portón finca'
                )
            "
        >

            PORTÓN FINCA

        </button>


    </div>

</div>



<!-- =============================================================
     EMPAREJAMIENTO
============================================================= -->

<div id="emparejamiento">


    <div class="pairCard">


        <h2>
            Emparejar Tesla
        </h2>


        <p>
            Introduce el código temporal
            de emparejamiento.
        </p>


        <input
            id="codigoPair"
            type="password"
            inputmode="numeric"
            placeholder="Código"
        >


        <button
            onclick="emparejar()"
        >

            Emparejar vehículo

        </button>


        <div id="pairEstado">

        </div>


    </div>

</div>



<!-- =============================================================
     SONIDO
============================================================= -->

<audio
    id="sonidoBoton"
    src="button_click.mp3"
    preload="auto">
</audio>



<script>


    // =============================================================
    // ÚNICO DATO PÚBLICO DEL BACKEND
    // =============================================================

    const worker =

        "https://ingenium-control.pablo-dosuarez.workers.dev";



    // =============================================================
    // ESTADO
    // =============================================================

    let posicionActual =
        null;


    let autorizado =
        false;


    let gpsIniciado =
        false;


    let comprobando =
        false;



    // =============================================================
    // CARGAR PÁGINA
    // =============================================================

    window.addEventListener(

        "load",

        function() {


            const token =

                localStorage.getItem(
                    "ingeniumTeslaToken"
                );


            if (!token) {


                mostrarEmparejamiento();


            } else {


                iniciarGPS();

            }

        }

    );



    // =============================================================
    // EMPAREJAMIENTO
    // =============================================================

    function mostrarEmparejamiento() {


        document
            .getElementById(
                "emparejamiento"
            )
            .style.display =
                "flex";

    }



    async function emparejar() {


        const codigo =

            document
                .getElementById(
                    "codigoPair"
                )
                .value
                .trim();


        const estado =

            document
                .getElementById(
                    "pairEstado"
                );


        if (!codigo) {


            estado.innerText =

                "Introduce el código";


            return;

        }


        estado.innerText =

            "Emparejando...";


        try {


            const respuesta =

                await fetch(

                    worker +
                    "/pair",

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json"

                        },


                        body:

                            JSON.stringify(

                                {

                                    code:
                                        codigo

                                }

                            )

                    }

                );


            const datos =

                await respuesta.json();


            if (!respuesta.ok) {


                estado.innerText =

                    datos.error ||

                    "Error de emparejamiento";


                return;

            }


            localStorage.setItem(

                "ingeniumTeslaToken",

                datos.token

            );


            estado.innerText =

                "Tesla emparejado correctamente";


            setTimeout(

                function() {


                    document
                        .getElementById(
                            "emparejamiento"
                        )
                        .style.display =
                            "none";


                    iniciarGPS();

                },

                800

            );


        } catch (error) {


            estado.innerText =

                "Error de conexión";


            console.error(
                error
            );

        }

    }



    // =============================================================
    // INICIAR GPS
    // =============================================================

    function iniciarGPS() {


        if (gpsIniciado) {

            return;
        }


        gpsIniciado =
            true;


        if (!navigator.geolocation) {


            document
                .getElementById(
                    "estado"
                )
                .innerText =

                    "GPS no disponible";


            return;
        }


        document
            .getElementById(
                "estado"
            )
            .innerText =

                "Buscando GPS...";


        navigator.geolocation.watchPosition(


            nuevaPosicion,


            errorGPS,


            {

                enableHighAccuracy:
                    true,


                maximumAge:
                    0,


                timeout:
                    20000

            }

        );

    }



    // =============================================================
    // NUEVA POSICIÓN
    // =============================================================
function nuevaPosicion(
    posicion
) {

    posicionActual = {

        lat:
            posicion.coords.latitude,

        lon:
            posicion.coords.longitude,

        accuracy:
            posicion.coords.accuracy

    };


    // No modificamos aquí el texto del GPS.
    // Esperamos a que Cloudflare compruebe
    // distancia, radio y precisión.

    comprobarAutorizacion();
}



    // =============================================================
    // COMPROBAR ZONA EN CLOUDFLARE
    // =============================================================

    async function comprobarAutorizacion() {


        if (
            !posicionActual ||
            comprobando
        ) {


            return;
        }


        comprobando =
            true;


        const token =

            localStorage.getItem(
                "ingeniumTeslaToken"
            );


        if (!token) {


            comprobando =
                false;


            mostrarEmparejamiento();


            return;
        }


        try {


            const respuesta =

                await fetch(

                    worker +
                    "/check",

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json",


                            "Authorization":

                                "Bearer " +
                                token

                        },


                        body:

                            JSON.stringify(
                                posicionActual
                            )

                    }

                );


            const datos =

                await respuesta.json();


            // -----------------------------------------------------
            // TOKEN NO VÁLIDO
            // -----------------------------------------------------

            if (
                respuesta.status === 401
            ) {


                autorizado =
                    false;


                actualizarBotones();


                localStorage.removeItem(
                    "ingeniumTeslaToken"
                );


                document
                    .getElementById(
                        "estado"
                    )
                    .innerText =

                        "Tesla no autorizado";


                setTimeout(

                    mostrarEmparejamiento,

                    700

                );


                comprobando =
                    false;


                return;

            }


            // -----------------------------------------------------
            // AUTORIZADO
            // -----------------------------------------------------

            if (
                respuesta.ok &&
                datos.autorizado
            ) {


                autorizado =
                    true;


                document
                    .getElementById(
                        "estado"
                    )
                    .innerText =

                        "● AUTORIZADO";


                document
                    .getElementById(
                        "gps"
                    )
                    .innerText =

                        "Distancia " +

                        datos.distancia +

                        " m   •   GPS ±" +

                        datos.precision +

                        " m";


            } else {


                autorizado =
                    false;


                document
                    .getElementById(
                        "estado"
                    )
                    .innerText =

                        "🔒 BLOQUEADO";


                if (
                    datos.distancia !== undefined
                ) {


                    document
                        .getElementById(
                            "gps"
                        )
                        .innerText =

                            "Distancia " +

                            datos.distancia +

                            " m   •   GPS ±" +

                            datos.precision +

                            " m";


                } else {


                    document
                        .getElementById(
                            "gps"
                        )
                        .innerText =

                            datos.error ||

                            "GPS no autorizado";

                }

            }


            actualizarBotones();


        } catch (error) {


            autorizado =
                false;


            actualizarBotones();


            document
                .getElementById(
                    "estado"
                )
                .innerText =

                    "Error de conexión";


            console.error(
                error
            );

        }


        comprobando =
            false;

    }



    // =============================================================
    // ERROR GPS
    // =============================================================

    function errorGPS(
        error
    ) {


        autorizado =
            false;


        actualizarBotones();


        document
            .getElementById(
                "estado"
            )
            .innerText =

                "GPS no disponible";


        document
            .getElementById(
                "gps"
            )
            .innerText =

                "Sin posición GPS";


        console.log(
            error
        );

    }



    // =============================================================
    // ACTIVAR / DESACTIVAR
    // =============================================================

    function actualizarBotones() {


        const botones =

            document
                .querySelectorAll(
                    ".boton"
                );


        botones.forEach(

            function(boton) {


                boton.disabled =

                    !autorizado;

            }

        );

    }



    // =============================================================
    // EJECUTAR ESCENA
    // =============================================================

    async function enviarOrden(
        accion,
        nombre
    ) {


        if (
            !autorizado ||
            !posicionActual
        ) {


            return;
        }


        reproducirSonido();


        const token =

            localStorage.getItem(
                "ingeniumTeslaToken"
            );


        if (!token) {


            autorizado =
                false;


            actualizarBotones();


            mostrarEmparejamiento();


            return;
        }


        const estado =

            document
                .getElementById(
                    "estado"
                );


        estado.innerText =

            "Enviando...";


        try {


            const respuesta =

                await fetch(

                    worker +
                    accion,

                    {

                        method:
                            "POST",


                        headers: {

                            "Content-Type":
                                "application/json",


                            "Authorization":

                                "Bearer " +
                                token

                        },


                        body:

                            JSON.stringify(
                                posicionActual
                            )

                    }

                );


            const datos =

                await respuesta.json();


            if (
                respuesta.status === 401
            ) {


                localStorage.removeItem(
                    "ingeniumTeslaToken"
                );


                autorizado =
                    false;


                actualizarBotones();


                estado.innerText =

                    "Tesla no autorizado";


                setTimeout(

                    mostrarEmparejamiento,

                    700

                );


                return;

            }


            if (respuesta.ok) {


                estado.innerText =

                    nombre +
                    " enviado";


            } else {


                autorizado =
                    false;


                actualizarBotones();


                estado.innerText =

                    datos.error ||

                    "Acceso bloqueado";
            }


        } catch (error) {


            estado.innerText =

                "Error de conexión";


            console.error(
                error
            );

        }


        // Volvemos a comprobar la zona
        // después de ejecutar.

        setTimeout(

            comprobarAutorizacion,

            2000

        );

    }



    // =============================================================
    // SONIDO
    // =============================================================

    function reproducirSonido() {


        const audio =

            document
                .getElementById(
                    "sonidoBoton"
                );


        try {


            audio.pause();


            audio.currentTime =
                0;


            const reproduccion =

                audio.play();


            if (
                reproduccion !== undefined
            ) {


                reproduccion.catch(

                    function(error) {


                        console.log(
                            "Audio bloqueado:",
                            error
                        );

                    }

                );

            }


        } catch (error) {


            console.log(
                error
            );

        }

    }


</script>


</body>

</html>
